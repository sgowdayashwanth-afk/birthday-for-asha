<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Asha 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 380px;
    z-index: 2;
}

h1 { color: #ff4d6d; }

button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
}

.slideshow img,
.slideshow video {
    width: 260px;
    border-radius: 15px;
    display: none;
    margin: 10px;
}
.slideshow .active {
    display: block;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<audio autoplay loop>
    <source src="paravashanadenu.mp3" type="audio/mpeg">
</audio>

<div class="card" id="startCard">
    <h1>🎂 Happy Birthday Asha ❤️</h1>
    <p>
        You are my favorite person, my safe place ✨<br>
        Nanna life-alli neenu special 💕
    </p>
    <button onclick="startSurprise()">Open Your Surprise 🎁</button>
</div>

<script>
function startSurprise() {
    document.getElementById("startCard").innerHTML = `
    <h1>💖 Happy Birthday Asha 💖</h1>
    <p>
        Every smile of yours makes my world brighter ✨<br>
        Ninna naguvu nanna happiness ❤️<br><br>
        I’m so grateful to have you in my life.
    </p>

    <div class="slideshow">
        <img src="photo1.jpg" class="active">
        <video src="video1.mp4" muted loop></video>
        <img src="photo2.jpg">
        <video src="video2.mp4" muted loop></video>
        <img src="photo3.jpg">
        <img src="photo4.jpg">
        <img src="photo5.jpg">
        <img src="photo6.jpg">
    </div>

    <p>
        Always yours ❤️<br>
        Ninna jothe ellaa moments precious 💞
    </p>
    `;
    startSlideshow();
}

let index = 0;
function startSlideshow() {
    const items = document.querySelectorAll(".slideshow img, .slideshow video");

    setInterval(() => {
        items[index].classList.remove("active");

        if (items[index].tagName === "VIDEO") {
            items[index].pause();
            items[index].currentTime = 0;
        }

        index = (index + 1) % items.length;
        items[index].classList.add("active");

        if (items[index].tagName === "VIDEO") {
            items[index].play();
        }
    }, 3000);
}

setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 300);

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function firework() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i = 0; i < 30; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height,
                Math.random()*3, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();
    }
}
setInterval(firework, 700);
</script>

</body>
</html>
